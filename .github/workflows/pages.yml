name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        # BASE_PATH must equal the lowercase repo slug (GitHub Pages
        # project sites are served under /<repo-slug>/).
        run: npm run build --workspace=apps/frontend -- --base-href /direct-democracy-municipal-feedback-issue-tracker/

      - name: SPA fallback
        # GitHub Pages serves 404.html for unknown routes; copying
        # index.html lets the Angular router handle deep links.
        run: cp apps/frontend/dist/browser/index.html apps/frontend/dist/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/dist/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
